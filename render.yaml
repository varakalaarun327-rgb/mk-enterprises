services:
  - type: web
    name: mk-enterprises-billing
    env: node
    plan: free
    region: singapore # Closest region to India / Telangana
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /var/data
    disk:
      name: mk-data
      mountPath: /var/data
      sizeGB: 1
